<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics · FlowTask Pro</title>
<script>
  (function () {
    try {
      var raw = localStorage.getItem('flowtask_settings_v1');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/utilities.css" />
<link rel="stylesheet" href="css/pages/analytics.css" />
<link rel="stylesheet" href="css/responsive.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="page" id="main-content">

      <div class="page-header">
        <div class="page-header__title">
          <h1>Analytics</h1>
          <p class="text-sm text-muted">Live metrics computed from your current workspace data.</p>
        </div>
      </div>

      <div class="grid kpi-grid" id="analytics-summary"></div>

      <div class="grid analytics-grid">
        <div class="chart-card">
          <h3>Tasks by status</h3>
          <div class="chart-card__canvas-wrap"><canvas id="status-chart" role="img" aria-label="Tasks by status doughnut chart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Tasks by priority</h3>
          <div class="chart-card__canvas-wrap"><canvas id="priority-chart" role="img" aria-label="Tasks by priority bar chart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Weekly completion activity</h3>
          <div class="chart-card__canvas-wrap"><canvas id="weekly-activity-chart" role="img" aria-label="Weekly completion line chart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Project progress</h3>
          <div class="chart-card__canvas-wrap"><canvas id="project-progress-chart" role="img" aria-label="Project progress bar chart"></canvas></div>
        </div>
      </div>

    </main>
  </div>
</div>
<script type="module" src="js/pages/analytics.js"></script>
</body>
</html>
