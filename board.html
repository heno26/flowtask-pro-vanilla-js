<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board · FlowTask Pro</title>
<script>
  (function () {
    try {
      var raw = localStorage.getItem('flowtask_settings_v1');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/utilities.css" />
<link rel="stylesheet" href="css/pages/board.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="page" id="main-content">

      <div class="board-toolbar">
        <div class="flex items-center gap-3" style="flex-wrap:wrap;">
          <div class="project-select-wrap">
            <select id="board-project-select" aria-label="Select project"></select>
          </div>
          <div class="board-progress-inline">
            <div class="progress"><div class="progress__fill" id="board-progress-fill" style="width:0%"></div></div>
            <span class="text-xs text-muted" id="board-progress-label">0%</span>
          </div>
        </div>
      </div>

      <div id="filters-container"></div>

      <div class="board" id="board"></div>

      <div class="empty-state" id="board-empty" hidden>
        <span>📋</span>
        <h3>No project selected</h3>
        <p>Create a project first, then come back to plan its board.</p>
        <a class="btn btn--primary" href="projects.html">Go to projects</a>
      </div>

    </main>
  </div>
</div>
<script type="module" src="js/pages/board.js"></script>
</body>
</html>
