<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar · FlowTask Pro</title>
<script>
  (function () {
    try {
      var raw = localStorage.getItem('flowtask_settings_v1');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/utilities.css" />
<link rel="stylesheet" href="css/pages/calendar.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="page" id="main-content">

      <div class="calendar-toolbar">
        <h1 id="calendar-month-label">Month</h1>
        <div class="calendar__nav">
          <button class="btn btn--secondary btn--sm" id="calendar-today">Today</button>
          <button class="btn btn--icon btn--secondary" id="calendar-prev" aria-label="Previous month"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span></button>
          <button class="btn btn--icon btn--secondary" id="calendar-next" aria-label="Next month"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
        </div>
      </div>

      <div class="calendar">
        <div class="calendar__weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="calendar__grid" id="calendar-grid"></div>
      </div>

      <div class="calendar-agenda" id="calendar-agenda"></div>

    </main>
  </div>
</div>
<script type="module" src="js/pages/calendar.js"></script>
</body>
</html>
