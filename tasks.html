<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks · FlowTask Pro</title>
<script>
  (function () {
    try {
      var raw = localStorage.getItem('flowtask_settings_v1');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/utilities.css" />
<link rel="stylesheet" href="css/pages/tasks.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="page" id="main-content">

      <div class="page-header">
        <div class="page-header__title">
          <h1>Tasks</h1>
          <p class="text-sm text-muted" id="result-count">0 tasks</p>
        </div>
      </div>

      <div id="filters-container"></div>

      <div class="table-wrap" id="tasks-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Task</th>
              <th>Project</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Assignee</th>
              <th>Due date</th>
              <th>Tags</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tasks-table-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="tasks-empty" hidden>
        <span>🔍</span>
        <h3>No tasks match</h3>
        <p>Try adjusting your search or filters.</p>
      </div>

      <div class="pagination" id="pagination"></div>

    </main>
  </div>
</div>
<script type="module" src="js/pages/tasks.js"></script>
</body>
</html>
